[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "supportsage"
version = "0.1.0"
description = "Rule-based customer support ticket triage (deterministic mock, no LLM calls)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
supportsage = "supportsage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
